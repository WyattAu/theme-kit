[package]
name = "theme-kit"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
authors = ["Wyatt Au <wyatt_au@protonmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/theme-kit"
homepage = "https://github.com/WyattAu/theme-kit"
documentation = "https://docs.rs/theme-kit"
description = "Typed design-token contract for the estate: DTCG 2025.10 in/out, semantic role vocabulary, build-failing WCAG contrast gate, derived CVD/high-contrast/monochrome variants, data-only emitters (CSS, VS Code, ANSI-16)"
readme = "README.md"
keywords = ["design-tokens", "theme", "wcag", "accessibility", "design-system"]
categories = ["command-line-interface", "graphics", "accessibility"]

exclude = [".github/", "supply-chain/"]

# Layer model: docs/layers.md in WyattAu/engineering-standards.
# L1 — substrate: the only cross-L2 coupling in the UI family (ADR-0004 §2).
[package.metadata.layers]
tier = "L1"

[dependencies]
color-kit = { path = "../color-kit", version = "0.1.0" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

# Theme discipline (mirrors color-kit / font-shape): a theme file is
# user-authored input and the gate runs on every authored token — malformed
# input, unknown roles, and contrast violations are typed errors, never
# panics. Test targets lift these at file level with justification.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
